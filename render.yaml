services:
  - type: web
    name: playcell-leads
    runtime: node
    # Start on Render's free instance; upgrade after validating production traffic.
    plan: free
    # Render's pnpm version may normalize overrides differently from the lockfile.
    # Free services do not support Render pre-deploy commands. Running the
    # official Drizzle migrator in the existing build gate applies only ledger
    # migrations and keeps the currently live release in place on failure.
    buildCommand: pnpm install --no-frozen-lockfile && pnpm db:migrate && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE
        value: playcell_leads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador Playcell
